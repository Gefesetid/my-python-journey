repos:
  - repo: https://github.com
    rev: v4.7.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com
    rev: v0.17.0
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

  - repo: https://github.com
    rev: v1.1.414
    hooks:
      - id: pyright
