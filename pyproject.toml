[project]
name = "my-python-journey"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gefestid", email = "naudamir@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "requests>=2.34.2",
]

[project.scripts]
my-python-journey = "my_python_journey:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.169.1",
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

